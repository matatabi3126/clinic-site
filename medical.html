<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>診療案内 | さくらクリニック</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">さくらクリニック</a>
        <nav class="nav-links" aria-label="主要ナビゲーション">
          <a href="index.html">トップ</a>
          <a class="active" href="medical.html">診療案内</a>
          <a href="staff.html">医師・スタッフ紹介</a>
          <a href="access.html">アクセス・診療時間</a>
          <a href="contact.html">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1 class="section-title">診療案内</h1>

        <div class="grid-3">
          <article class="card">
            <div class="illustration-card small" aria-hidden="true">
              <svg viewBox="0 0 220 140" role="img" aria-label="聴診器のイラスト">
                <circle cx="74" cy="70" r="28" fill="#ffffff" stroke="#4f9ed9" stroke-width="4" />
                <path d="M56 70h36" stroke="#78c2a8" stroke-width="5" stroke-linecap="round" />
                <path d="M74 42c0-16 18-24 32-16" stroke="#4f9ed9" stroke-width="4" fill="none" stroke-linecap="round" />
                <circle cx="118" cy="76" r="26" fill="#ffffff" stroke="#4f9ed9" stroke-width="4" />
                <rect x="114" y="62" width="10" height="28" rx="4" fill="#78c2a8" />
              </svg>
            </div>
            <h3>内科</h3>
            <ul class="list">
              <li>風邪症状・発熱</li>
              <li>咳・鼻水・のどの痛み</li>
              <li>高血圧・脂質異常症</li>
              <li>生活習慣病の相談</li>
            </ul>
          </article>
          <article class="card">
            <div class="illustration-card small" aria-hidden="true">
              <svg viewBox="0 0 220 140" role="img" aria-label="体温計のイラスト">
                <rect x="84" y="28" width="50" height="82" rx="18" fill="#ffffff" stroke="#4f9ed9" stroke-width="4" />
                <rect x="98" y="44" width="22" height="38" rx="8" fill="#b7e5d8" />
                <rect x="92" y="20" width="34" height="12" rx="6" fill="#78c2a8" />
                <path d="M104 90v24" stroke="#4f9ed9" stroke-width="4" stroke-linecap="round" />
                <circle cx="104" cy="118" r="12" fill="#78c2a8" />
              </svg>
            </div>
            <h3>小児科</h3>
            <ul class="list">
              <li>発熱・食欲不振</li>
              <li>おたふく・水ぼうそうなどの流行性疾患</li>
              <li>予防接種相談</li>
              <li>成長・発達の気になること</li>
            </ul>
          </article>
          <article class="card">
            <div class="illustration-card small" aria-hidden="true">
              <svg viewBox="0 0 220 140" role="img" aria-label="心拍のイラスト">
                <circle cx="92" cy="72" r="34" fill="#ffffff" stroke="#4f9ed9" stroke-width="4" />
                <path d="M70 74h14l8-14 10 28 10-16h18" stroke="#78c2a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                <path d="M126 50c10-12 26-12 36 0" stroke="#4f9ed9" stroke-width="4" fill="none" stroke-linecap="round" />
              </svg>
            </div>
            <h3>対応できる主な症状</h3>
            <ul class="list">
              <li>頭痛・腹痛</li>
              <li>息苦しさ・動悸</li>
              <li>皮膚のかゆみ・湿疹</li>
              <li>体調不良全般</li>
            </ul>
          </article>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 さくらクリニック</div>
    </footer>
  </body>
</html>
