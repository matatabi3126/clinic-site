<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせ | さくらクリニック</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">さくらクリニック</a>
        <nav class="nav-links" aria-label="主要ナビゲーション">
          <a href="index.html">トップ</a>
          <a href="medical.html">診療案内</a>
          <a href="staff.html">医師・スタッフ紹介</a>
          <a href="access.html">アクセス・診療時間</a>
          <a class="active" href="contact.html">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1 class="section-title">お問い合わせ</h1>
        <article class="card">
          <form>
            <div class="form-grid">
              <div>
                <label for="name">お名前</label>
                <input id="name" name="name" type="text" placeholder="例：山田 太郎" />
              </div>
              <div>
                <label for="tel">電話番号</label>
                <input id="tel" name="tel" type="tel" placeholder="例：03-0000-0000" />
              </div>
              <div class="full">
                <label for="message">お問い合わせ内容</label>
                <textarea id="message" name="message" placeholder="ご質問・ご予約希望などをお書きください"></textarea>
              </div>
            </div>
            <button class="btn" type="submit" style="margin-top: 1rem; border: none; cursor: pointer;">送信する</button>
          </form>
        </article>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 さくらクリニック</div>
    </footer>
  </body>
</html>
